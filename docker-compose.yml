# Entorno completo: base de datos, API y web.
#   docker compose up --build
#   docker compose exec api npx ts-node prisma/seed.ts   (datos de demostración, opcional)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ph
      POSTGRES_PASSWORD: ph
      POSTGRES_DB: ph
    volumes: [db:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ph"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://ph:ph@db:5432/ph
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion-por-una-larga}
      CORS_ORIGINS: http://localhost:3000
      UPLOADS_DIR: /repo/apps/api/uploads
    volumes: [uploads:/repo/apps/api/uploads]
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000/api }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db:
  uploads:
