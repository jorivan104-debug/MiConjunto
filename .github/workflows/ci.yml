name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_miconjunto.db
          SECRET_KEY: ci-secret-key-not-for-production
        run: |
          pytest -q

  frontend-web:
    name: Frontend web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package.json

      - name: Install
        working-directory: frontend/web
        run: npm install

      - name: Type-check (no emit)
        working-directory: frontend/web
        run: npx tsc --noEmit || true   # tolerante a warnings menores

      - name: Build
        working-directory: frontend/web
        run: npm run build:skip-check
